; RescueVision Edge — ESP32-S3 TFLite Micro Victim Detection
; PlatformIO Project Configuration

[platformio]
description = RescueVision Edge: Quantized YOLOv8n inference on ESP32-S3 for SAR victim detection

[env:esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_upload.verify = yes

upload_port = /dev/cu.usbmodem31301
upload_resetmethod = cdc
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    -DTF_LITE_STRIP_ERROR_STRINGS
    ; Optimize for size + speed
    -O2
    -mno-unaligned-access

lib_deps =
    ; TensorFlow Lite Micro for ESP32
    https://github.com/espressif/tflite-micro-esp-examples.git#master
    ; ESP32 camera driver
    esp32-camera
    ; JSON for structured serial output
    bblanchon/ArduinoJson @ 7.0.0

lib_ignore =
    ; Exclude unused TF micro components to save flash
    tensorflow/lite/micro/examples

board_build.extra_flags = -Wl,--defsym=esp_ram_size=8388608
