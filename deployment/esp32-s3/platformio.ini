; RescueVision Edge — ESP32-S3 TFLite Micro Victim Detection
; PlatformIO Project Configuration

[platformio]
description = RescueVision Edge: Quantized YOLOv8n inference on ESP32-S3 for SAR victim detection

[env:esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = max_app_8MB.csv
board_upload.verify = yes

upload_port = /dev/cu.usbmodem31201
upload_resetmethod = cdc
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -fpermissive
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    ; Include paths for local tflite-micro with flatbuffers
    -Ilib/tflite-micro/tensorflow
    -Ilib/tflite-micro/third_party/flatbuffers/include
    -Ilib/tflite-micro/third_party/gemmlowp
    -Ilib/tflite-micro/third_party/kissfft
    -Ilib/tflite-micro/third_party/ruy
    ; ESP-NN optimized NN kernels for ESP32-S3 (Xtensa LX7 SIMD)
    -Ilib/esp-nn/include
    -Ilib/esp-nn/src/common
    -DESP_NN
    -DCONFIG_NN_OPTIMIZED
    -O2

lib_deps =
    ; ESP32 camera driver
    esp32-camera
    ; JSON for structured serial output
    bblanchon/ArduinoJson @ 7.0.0

; Using local lib/tflite-micro with bundled flatbuffers instead of GitHub dependency
; see lib/tflite-micro/ for the full tflite-micro source with third_party deps

board_build.extra_flags = -Wl,--defsym=esp_ram_size=8388608
