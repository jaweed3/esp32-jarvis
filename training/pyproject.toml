[project]
name = "rescuevision-edge"
version = "0.1.0"
description = "Quantized YOLO victim detection on ESP32-S3 for disaster SAR"
requires-python = ">=3.10"

dependencies = [
    # torch>=2.0.0 (installed via CUDA index)
    # torchvision>=0.15.0 (installed via CUDA index)
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "onnx-tf>=1.10.0",
    "tensorflow>=2.13.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "jupyter>=1.0.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
